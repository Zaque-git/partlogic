<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar conta — PartLogic</title>
  <meta name="description" content="Crie sua conta no PartLogic e cadastre seus veículos para verificar peças." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-shell grade-tecnica">
    <div class="auth-card anim-rise">
      <h1 class="auth-title" style="margin-top:0">Criar conta</h1>
      <p class="auth-sub">Leva menos de um minuto e já dá para cadastrar o primeiro veículo.</p>

      <div id="erro" class="alert alert-danger anim-rise hidden" style="margin-top:1.25rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="erro-texto"></span>
      </div>

      <form id="form-cadastro" novalidate style="margin-top:1.5rem">
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" maxlength="100" placeholder="Nome completo" />
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" maxlength="255" placeholder="voce@email.com" />
        </div>
        <div class="field">
          <label for="telefone">Telefone</label>
          <input id="telefone" maxlength="20" placeholder="(92) 99999-0000" />
        </div>
        <div class="form-grid">
          <div class="field col-sm-6">
            <label for="senha">Senha</label>
            <div class="input-wrap">
              <input id="senha" type="password" maxlength="64" class="has-toggle" />
              <button type="button" class="input-toggle" id="toggle-senha" aria-label="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div class="field col-sm-6">
            <label for="confirmar">Confirmar senha</label>
            <input id="confirmar" type="password" maxlength="64" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-criar">Criar conta</button>
      </form>

      <p class="auth-footer">Já tem conta? <a href="login.html">Voltar ao login</a></p>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      await App.init();
      if (App.usuario) location.replace("dashboard.html");
    })();

    const senhaInput = document.getElementById("senha");
    const toggleBtn = document.getElementById("toggle-senha");
    let mostrar = false;
    toggleBtn.addEventListener("click", () => {
      mostrar = !mostrar;
      senhaInput.type = mostrar ? "text" : "password";
      document.getElementById("confirmar").type = mostrar ? "text" : "password";
      toggleBtn.innerHTML = mostrar ? icon("eyeoff") : icon("eye");
    });

    function mostrarErro(msg) {
      document.getElementById("erro-texto").textContent = msg;
      document.getElementById("erro").classList.remove("hidden");
    }
    function esconderErro() { document.getElementById("erro").classList.add("hidden"); }

    document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
      e.preventDefault();
      esconderErro();
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const telefone = document.getElementById("telefone").value;
      const senha = senhaInput.value;
      const confirmar = document.getElementById("confirmar").value;

      if (nome.trim().length < 3) return mostrarErro("Informe seu nome completo.");
      if (!email.includes("@")) return mostrarErro("Informe um e-mail válido.");
      if (telefone.replace(/\D/g, "").length < 10) return mostrarErro("Informe um telefone válido.");
      if (senha.length < 6) return mostrarErro("A senha deve ter no mínimo 6 caracteres.");
      if (senha !== confirmar) return mostrarErro("As senhas não conferem.");

      const btn = document.getElementById("btn-criar");
      btn.disabled = true;
      btn.innerHTML = `${icon("loader", "spin")} Criando conta...`;
      try {
        await App.cadastrar({ nome: nome.trim(), email: email.trim(), telefone: telefone.trim(), senha });
        location.href = "dashboard.html";
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Criar conta";
        mostrarErro(err instanceof Error ? err.message : "Não foi possível criar a conta.");
      }
    });
  </script>
</body>
</html>
